name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    name: PHP / Laravel tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: speach_test, POSTGRES_USER: speach, POSTGRES_PASSWORD: speach }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U speach -d speach_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: speach_test
      DB_USERNAME: speach
      DB_PASSWORD: speach
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, xml, ctype, curl, dom, fileinfo, filter, hash, iconv, intl, json, libxml, openssl, pcre, pdo, session, tokenizer
          coverage: none
      - run: composer validate --no-check-publish
        name: Validate Composer configuration
      - run: composer install --no-interaction --prefer-dist --no-progress
        name: Install PHP dependencies
      - run: php artisan test
        name: Run Laravel tests against PostgreSQL
  frontend:
    name: React lint and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        name: Install frontend dependencies
      - run: npm run lint
        name: Lint React source
      - run: npm run build
        name: Build frontend assets
