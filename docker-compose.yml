services:
  app:
    build: { context: ., dockerfile: Dockerfile }
    container_name: speach-app
    restart: unless-stopped
    ports: ["${APP_PORT:-8080}:80"]
    environment:
      APP_NAME: Speach
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: speach
      DB_USERNAME: speach
      DB_PASSWORD: speach
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "php", "artisan", "about"]
      interval: 30s
      timeout: 10s
      retries: 3
  postgres:
    image: postgres:17-alpine
    container_name: speach-postgres
    restart: unless-stopped
    environment: { POSTGRES_DB: speach, POSTGRES_USER: speach, POSTGRES_PASSWORD: speach }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speach -d speach"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
